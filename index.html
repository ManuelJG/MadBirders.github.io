<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Mad Birders</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #111111;
            color: #f2f2f2;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }


        /* =========================
           LANGUAGE TOGGLE
        ========================= */

        .language-toggle {
            position: fixed;
            top: 28px;
            right: 32px;

            display: flex;
            align-items: center;
            gap: 8px;

            font-size: 13px;
            letter-spacing: 0.5px;

            z-index: 20;
        }

        .language {
            cursor: pointer;
            opacity: 0.45;
            transition: opacity 0.2s ease;
            user-select: none;
        }

        .language:hover {
            opacity: 0.8;
        }

        .language.active {
            opacity: 1;
        }

        .separator {
            opacity: 0.3;
        }


        /* =========================
           MAIN
        ========================= */

        .main {
            width: 100%;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 90px 25px 60px;
        }


        /* =========================
           WELCOME
        ========================= */

        .welcome {
            font-size: clamp(18px, 2.2vw, 28px);
            font-weight: 400;
            letter-spacing: 4px;

            margin-bottom: clamp(22px, 3vh, 34px);

            opacity: 0;
            transform: translateY(8px);

            animation: fadeUp 0.7s ease forwards;
            animation-delay: 0.1s;
        }


        /* =========================
           LOGO
        ========================= */

        .logo {
            width: clamp(130px, 18vw, 220px);
            height: auto;

            display: block;

            opacity: 0;
            transform: scale(0.92);

            animation: logoIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: 0.15s;
        }


        /* =========================
           CALENDAR
        ========================= */

        .calendar-container {
            width: min(900px, 100%);

            margin-top: clamp(40px, 6vh, 65px);

            opacity: 0;
            transform: translateY(10px);

            animation: fadeUp 0.7s ease forwards;
            animation-delay: 0.35s;
        }


        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes logoIn {

            from {
                opacity: 0;
                transform: scale(0.92);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }

        @keyframes fadeUp {

            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .language-toggle {
                top: 20px;
                right: 22px;
                font-size: 12px;
            }

            .main {
                padding: 75px 18px 40px;
            }

            .logo {
                width: clamp(120px, 42vw, 180px);
            }

            .welcome {
                letter-spacing: 3px;
            }

            .calendar-container {
                margin-top: 38px;
            }

        }

    </style>
</head>


<body>


    <!-- =========================
         LANGUAGE TOGGLE
    ========================= -->

    <div class="language-toggle">

        <span
            id="lang-es"
            class="language active"
        >
            ES
        </span>

        <span class="separator">
            /
        </span>

        <span
            id="lang-en"
            class="language"
        >
            EN
        </span>

    </div>


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <main class="main">


        <!-- WELCOME -->

        <div
            id="welcome"
            class="welcome"
        >
            BIENVENIDO
        </div>


        <!-- LOGO -->

        <img
            src="mad.PNG"
            alt="The Mad Birders"
            class="logo"
        >


        <!-- CALENDAR -->

        <div class="calendar-container">

            <!--
                El calendario se carga desde cal.html
            -->

            <iframe
                src="cal.html"
                title="Calendario The Mad Birders"
                style="
                    width: 100%;
                    min-height: 850px;
                    border: none;
                    background: transparent;
                "
            ></iframe>

        </div>


    </main>


    <!-- =========================
         LANGUAGE SCRIPT
    ========================= -->

    <script>

        const welcome = document.getElementById("welcome");

        const langES = document.getElementById("lang-es");

        const langEN = document.getElementById("lang-en");


        function setLanguage(language) {

            if (language === "es") {

                welcome.textContent = "BIENVENIDO";

                langES.classList.add("active");

                langEN.classList.remove("active");

                document.documentElement.lang = "es";

            } else {

                welcome.textContent = "WELCOME";

                langEN.classList.add("active");

                langES.classList.remove("active");

                document.documentElement.lang = "en";

            }

        }


        langES.addEventListener("click", function () {

            setLanguage("es");

        });


        langEN.addEventListener("click", function () {

            setLanguage("en");

        });

    </script>


</body>
</html>
