<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Mad Birders</title>

    <link
    rel="icon"
    type="image/png"
    href="mad.PNG"
    >
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #111111;
            color: #f2f2f2;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }


        /* =========================
           LANGUAGE TOGGLE
        ========================= */

        .language-toggle {
            position: fixed;
            top: 28px;
            right: 32px;

            display: flex;
            align-items: center;
            gap: 8px;

            font-size: 13px;
            letter-spacing: 0.5px;

            z-index: 10;
        }

        .language {
            cursor: pointer;
            opacity: 0.45;
            transition: opacity 0.2s ease;
            user-select: none;
        }

        .language:hover {
            opacity: 0.8;
        }

        .language.active {
            opacity: 1;
        }

        .separator {
            opacity: 0.3;
        }


        /* =========================
           MAIN
        ========================= */

        .main {
            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 40px;
        }


        /* =========================
           WELCOME
        ========================= */

        .welcome {
            font-size: clamp(18px, 2.2vw, 28px);
            font-weight: 400;
            letter-spacing: 4px;

            margin-bottom: clamp(22px, 3vh, 36px);

            opacity: 0;
            transform: translateY(8px);

            animation: fadeUp 0.7s ease forwards;
            animation-delay: 0.1s;
        }


        /* =========================
           LOGO
        ========================= */

        .logo {
            width: clamp(130px, 18vw, 220px);
            height: auto;

            display: block;

            opacity: 0;
            transform: scale(0.92);

            animation: logoIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: 0.15s;
        }


        /* =========================
           MENU
        ========================= */

        .main-menu {
            display: flex;
            justify-content: center;
            align-items: center;

            margin-top: clamp(28px, 4vh, 42px);

            opacity: 0;
            transform: translateY(8px);

            animation: fadeUp 0.7s ease forwards;
            animation-delay: 0.35s;
        }

        .main-menu a {
            color: #f2f2f2;
            text-decoration: none;
            opacity: 0.65;

            display: flex;
            align-items: center;
            gap: 7px;

            font-size: 13px;
            letter-spacing: 0.5px;

            transition: opacity 0.2s ease;
        }

        .main-menu a:hover {
            opacity: 1;
        }


        /* =========================
           CALENDAR ICON
        ========================= */

        .calendar-icon {
            width: 15px;
            height: 15px;

            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }


        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes logoIn {

            from {
                opacity: 0;
                transform: scale(0.92);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }

        @keyframes fadeUp {

            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .language-toggle {
                top: 20px;
                right: 22px;
                font-size: 12px;
            }

            .main {
                padding: 30px;
            }

            .logo {
                width: clamp(120px, 42vw, 180px);
            }

            .welcome {
                letter-spacing: 3px;
            }

            .main-menu {
                margin-top: 32px;
            }

        }

    </style>
</head>


<body>


    <!-- =========================
         LANGUAGE TOGGLE
    ========================= -->

    <div class="language-toggle">

        <span
            id="lang-es"
            class="language active"
        >
            ES
        </span>

        <span class="separator">
            /
        </span>

        <span
            id="lang-en"
            class="language"
        >
            EN
        </span>

    </div>


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <main class="main">


        <!-- WELCOME -->

        <div
            id="welcome"
            class="welcome"
        >
            BIENVENIDO
        </div>


        <!-- LOGO -->

        <img
            src="mad.PNG"
            alt="The Mad Birders"
            class="logo"
        >


        <!-- MENU -->

        <nav class="main-menu">

            <a href="cal.html">

                <svg
                    class="calendar-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <rect
                        x="3"
                        y="4"
                        width="18"
                        height="17"
                        rx="2"
                    ></rect>

                    <line
                        x1="3"
                        y1="9"
                        x2="21"
                        y2="9"
                    ></line>

                    <line
                        x1="8"
                        y1="2"
                        x2="8"
                        y2="6"
                    ></line>

                    <line
                        x1="16"
                        y1="2"
                        x2="16"
                        y2="6"
                    ></line>

                </svg>

                <span id="calendar-text">
                    Calendario
                </span>

            </a>

        </nav>


    </main>


    <!-- =========================
         LANGUAGE SCRIPT
    ========================= -->

    <script>

        const welcome = document.getElementById("welcome");

        const calendarText = document.getElementById("calendar-text");

        const langES = document.getElementById("lang-es");

        const langEN = document.getElementById("lang-en");


        function setLanguage(language) {

            if (language === "es") {

                welcome.textContent = "BIENVENIDO";

                calendarText.textContent = "Calendario";

                langES.classList.add("active");

                langEN.classList.remove("active");

                document.documentElement.lang = "es";

            } else {

                welcome.textContent = "WELCOME";

                calendarText.textContent = "Calendar";

                langEN.classList.add("active");

                langES.classList.remove("active");

                document.documentElement.lang = "en";

            }

        }


        langES.addEventListener("click", function () {

            setLanguage("es");

        });


        langEN.addEventListener("click", function () {

            setLanguage("en");

        });

    </script>


</body>
</html>
